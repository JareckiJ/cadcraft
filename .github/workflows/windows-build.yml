# Builds an unsigned Windows x64 CADCraft (with the Polish translation) and uploads it as a
# downloadable artifact. Runs on pushes to the `windows-build` branch or by hand from the Actions tab.
name: Windows build

on:
  push:
    branches: [windows-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
      - name: Build
        run: cargo build --release -p cadcraft
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target\release\cadcraft.exe out\
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: cadcraft-windows-x64
          path: out/
          retention-days: 30
