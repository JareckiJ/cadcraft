# Evaluates the Nix flake (no build, about a minute): `nix build` / `nix develop` stop at evaluation
# when Cargo.lock gains something nix/package.nix can't vendor, and nothing else would notice.
name: Nix

on:
  push:
    branches: [main]
    paths: ["flake.nix", "flake.lock", "nix/**", "Cargo.lock", ".github/workflows/nix.yml"]
  pull_request:
    paths: ["flake.nix", "flake.lock", "nix/**", "Cargo.lock", ".github/workflows/nix.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/nix.yml@main

  git-sources:
    name: Git dependencies come from storytold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Cargo.lock
        run: |
          python3 - <<'PY'
          import sys, tomllib
          with open("Cargo.lock", "rb") as f:
              packages = tomllib.load(f).get("package", [])
          bad = [
              f"{p.get('name')} {p['source']}"
              for p in packages
              if p.get("source", "").startswith("git+")
              and not p["source"].startswith("git+https://github.com/storytold/")
          ]
          if bad:
              print("Cargo.lock has a git dependency outside github.com/storytold:", *bad, sep="\n  ")
              sys.exit(1)
          PY
