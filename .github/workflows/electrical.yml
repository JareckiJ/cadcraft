# Builds and tests the electrical (IEC 81346 tagging) commands on every push to a feature branch.
# Failures are also reported as annotations (readable through the checks API).
name: Electrical

on:
  push:
    branches: ["feature/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -p cadcraft-engine -p cadcraft-ecad -p cadcraft-ecad-cloud -p cadcraft-ui-egui -- --check
      - name: Keep Cargo.lock in step with new dependencies
        shell: bash
        run: |
          cargo metadata --format-version 1 > /dev/null
          if ! git diff --quiet Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Cargo.lock" Cargo.lock
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Tests and clippy
        shell: bash
        run: |
          set +e
          set -o pipefail
          report() {
            # Errors and failing tests, without build progress, in annotations of 30 lines.
            grep -v -E '^\s*(Compiling|Downloaded|Downloading|Checking|Running|Doc-tests|Fresh)|^test .* ok$' "$1" \
              | grep -E -A12 '^(error|warning)|panicked|FAILED|^failures:|test result' | head -270 > rep.txt
            [ -s rep.txt ] || tail -120 "$1" > rep.txt
            split -l 30 rep.txt part_
            for f in part_*; do
              [ -f "$f" ] || continue
              msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
              echo "::error title=$2::$msg"
            done
            rm -f part_* rep.txt
          }
          status=0
          { cargo test -p cadcraft-ecad -p cadcraft-ecad-cloud && cargo test -p cadcraft-engine --lib electrical && cargo test -p cadcraft-ui-egui --lib -- i18n devices docking menus; } 2>&1 | tee t1.txt || { report t1.txt electrical-tests; status=1; }
          if [ $status -eq 0 ]; then
            cargo test -p cadcraft-engine 2>&1 | tee t2.txt || { report t2.txt engine-tests; status=1; }
          fi
          cargo clippy -p cadcraft-ecad -p cadcraft-ecad-cloud -p cadcraft-engine -p cadcraft-ui-egui --all-targets -- -D warnings 2>&1 | tee t3.txt || { report t3.txt clippy; status=1; }
          # On success, show the test counts so a passing run proves the tests ran.
          if [ $status -eq 0 ]; then
            echo "::notice title=tests::$(grep -h 'test result' t1.txt t2.txt 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' ' ')"
          fi
          exit $status
