# Builds and tests the electrical (IEC 81346 tagging) commands on every push to a feature branch.
# Failures are also reported as annotations (readable through the checks API).
name: Electrical

on:
  push:
    branches: ["feature/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -p cadcraft-engine -p cadcraft-ecad -p cadcraft-ecad-cloud -p cadcraft-ui-egui -p cadcraft-cli -- --check
      - name: Keep Cargo.lock in step with new dependencies
        shell: bash
        run: |
          cargo metadata --format-version 1 > /dev/null
          if ! git diff --quiet Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Cargo.lock" Cargo.lock
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Tests and clippy
        shell: bash
        run: |
          set +e
          set -o pipefail
          report() {
            # Errors and failing tests, without build progress, in annotations of 30 lines.
            grep -v -E '^\s*(Compiling|Downloaded|Downloading|Checking|Running|Doc-tests|Fresh)|^test .* ok$' "$1" \
              | grep -E -A12 '^(error|warning)|panicked|FAILED|^failures:|test result' | head -270 > rep.txt
            [ -s rep.txt ] || tail -120 "$1" > rep.txt
            split -l 30 rep.txt part_
            for f in part_*; do
              [ -f "$f" ] || continue
              msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
              echo "::error title=$2::$msg"
            done
            rm -f part_* rep.txt
          }
          status=0
          { cargo test -p cadcraft-ecad -p cadcraft-ecad-cloud && cargo test -p cadcraft-engine --lib electrical && cargo test -p cadcraft-ui-egui --lib -- i18n devices docking menus; } 2>&1 | tee t1.txt || { report t1.txt electrical-tests; status=1; }
          if [ $status -eq 0 ]; then
            cargo test -p cadcraft-engine 2>&1 | tee t2.txt || { report t2.txt engine-tests; status=1; }
          fi
          cargo clippy -p cadcraft-ecad -p cadcraft-ecad-cloud -p cadcraft-engine -p cadcraft-ui-egui -p cadcraft-cli --all-targets -- -D warnings 2>&1 | tee t3.txt || { report t3.txt clippy; status=1; }
          # The generator end to end: a project from the example BOM and netlist.
          if [ $status -eq 0 ]; then
            cargo run -q -p cadcraft-cli -- generate --bom examples/electrical/generator/bom.csv \
              --netlist examples/electrical/generator/netlist.csv --template examples/electrical/generator/template \
              --out gen-out 2>&1 | tee t4.txt || { report t4.txt generate; status=1; }
            ls gen-out/*.dxf > /dev/null 2>&1 || { echo "::error title=generate::no sheets written"; status=1; }
            grep -q "warning\|failed" t4.txt && { report t4.txt generate-warnings; status=1; }
          fi
          # The demo project end to end, then what its reports read.
          if [ $status -eq 0 ]; then
            cargo build -q -p cadcraft-cli && bash examples/electrical/make-demo.sh target/debug/cadcraft-cli demo-out 2>&1 | tee t5.txt || { report t5.txt demo; status=1; }
            grep -qi "error" t5.txt && { report t5.txt demo-errors; status=1; }
            for k in bom terminals plcio cables wirelist; do
              target/debug/cadcraft-cli run --metric --cmd "eproject.open {\"path\": \"$PWD/demo-out/Demo.ecproj\"}" --cmd "ereport {\"kind\": \"$k\", \"path\": \"$PWD/demo-out/$k.csv\"}" > /dev/null 2>&1 || true
            done
            for f in demo-out/*.csv; do echo "::notice title=$(basename $f)::$(head -c 900 $f | tr '\n' '|')"; done
          fi
          # On success, show the test counts so a passing run proves the tests ran.
          if [ $status -eq 0 ]; then
            echo "::notice title=tests::$(grep -h 'test result' t1.txt t2.txt 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' ' ')"
          fi
          exit $status
