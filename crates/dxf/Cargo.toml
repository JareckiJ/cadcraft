[package]
name = "cadcraft-dxf"
description = "Standalone DXF tag reader/writer (ASCII and binary, pre-2007 code pages), from the published DXF reference"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
log = { workspace = true }
encoding_rs = { workspace = true }
# The DOS code pages of pre-2007 DXF text (decoding tables only; MIT, already used by acadrust).
oem_cp = { version = "2.1.2", default-features = false }
