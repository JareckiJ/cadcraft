[package]
name = "cadcraft-engine"
description = "CADCraft engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
cadcraft-dxf = { workspace = true }
cadcraft-constraints = { workspace = true }
cadcraft-fonts = { workspace = true }
cadcraft-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.12", default-features = false }
# Deflate for drawing-history versions: DXF is verbose text, so a gzipped snapshot is roughly a
# tenth of the size (MIT OR Apache-2.0, pure Rust backend, builds for wasm).
flate2 = "1"
# The calendar for drawing-history stamps (MIT OR Apache-2.0, pure Rust, no system time zone
# database needed): the history names and lists moments in UTC and nothing here hand-rolls the
# conversion (issue #1785). No `clock` feature: `now` reads the process clock, the crate formats.
chrono = { workspace = true }

[dev-dependencies]
# Real DXF files for the external reference tests (io is a lower layer).
cadcraft-io = { workspace = true }
