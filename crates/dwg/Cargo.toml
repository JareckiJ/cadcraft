[package]
name = "cadcraft-dwg"
description = "CADCraft DWG bridge: converts DWG to and from DXF bytes, with BlackCAD's open DWG crates (MIT OR Apache-2.0) first and the acadrust crate (MPL-2.0, used unmodified) second"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# MIT OR Apache-2.0, standard library only, so on every target, the web build included.
cad-dwg = { workspace = true }
cad-dxf = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# MPL-2.0: used as an unmodified dependency only (see plan/adr/0001 and NOTICE).
acadrust = "0.6.4"
